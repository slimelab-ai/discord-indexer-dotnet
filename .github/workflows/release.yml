name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    needs: build-and-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Windows
        shell: pwsh
        run: ./publish-windows.ps1
      - name: Package Windows
        shell: pwsh
        run: |
          $files = Get-ChildItem out/windows -File
          $lines = foreach ($file in $files) {
            "$( (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($file.Name)"
          }
          $lines | Set-Content out/discord-indexer-win-x64.sha256 -Encoding ascii
          Copy-Item out/discord-indexer-win-x64.sha256 out/windows/
          Compress-Archive -Path out/windows/* -DestinationPath out/discord-indexer-win-x64.zip
      - name: Upload Windows release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/discord-indexer-win-x64.zip
            out/discord-indexer-win-x64.sha256

  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (linux-x64 single-file)
        run: |
          dotnet restore
          dotnet publish discord-indexer.csproj -c Release -r linux-x64 -o out \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:UseAppHost=true \
            -p:PublishTrimmed=false
          chmod +x out/discord-indexer

          # Include helper CLI scripts in the release artifacts
          cp -v ./discord-indexer-search out/discord-indexer-search
          cp -v ./discord-indexer-delta out/discord-indexer-delta
          cp -v ./discord-indexer-migrate-attachments out/discord-indexer-migrate-attachments
          cp -v ./install-discord-indexer-service.sh out/install-discord-indexer-service.sh
          cp -v ./install-discord-indexer-from-release.sh out/install-discord-indexer-from-release.sh
          chmod +x out/discord-indexer-search out/discord-indexer-delta out/discord-indexer-migrate-attachments out/install-discord-indexer-service.sh out/install-discord-indexer-from-release.sh

      - name: Package
        run: |
          set -euo pipefail
          cd out
          sha256sum discord-indexer discord-indexer-search discord-indexer-delta discord-indexer-migrate-attachments install-discord-indexer-service.sh install-discord-indexer-from-release.sh > discord-indexer-linux-x64.sha256
          tar -czf discord-indexer-linux-x64.tar.gz discord-indexer discord-indexer-search discord-indexer-delta discord-indexer-migrate-attachments install-discord-indexer-service.sh install-discord-indexer-from-release.sh discord-indexer-linux-x64.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/discord-indexer-linux-x64.tar.gz
            out/discord-indexer-linux-x64.sha256
          generate_release_notes: true
